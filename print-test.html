<h1>ทดสอบพิมพ์ใบรับซื้อ → Y58 (บลูทูธ)</h1>
<p>พิมพ์ตรงจาก Chrome ไปที่เครื่องพิมพ์ ไม่ต้องใช้ไดรเวอร์</p>
<p><b>1.</b> เปิดเครื่องพิมพ์ และเชื่อมบลูทูธกับ Mac ไว้แล้ว (Y58_E938)</p>
<p><b>2.</b> กด "เลือกเครื่องพิมพ์" → เลือกรายการที่มีชื่อ <b>Y58</b> → เชื่อมต่อ</p>
<p><b>3.</b> กด "พิมพ์ใบรับซื้อตัวอย่าง"</p>

      if(o.k==='logo'){ if(logo.complete&&logo.naturalWidth){const lw=200,lh=lw*logo.naturalHeight/logo.naturalWidth; if(!dry){g.fillStyle='#000'; const t=document.createElement('canvas');t.width=lw;t.height=lh;const tg=t.getContext('2d');tg.drawImage(logo,0,0,lw,lh);tg.globalCompositeOperation='source-in';tg.fillStyle='#000';tg.fillRect(0,0,lw,lh);g.drawImage(t,(W-lw)/2,y);} y+=lh+6;} continue;}
      if(o.k==='hr'){ y+=6; if(!dry){g.fillStyle='#000';for(let x=0;x<W;x+=8)g.fillRect(x,y,5,2);} y+=10; continue;}
      if(o.k==='sp'){ y+=o.h; continue;}
      const s=o.s||22; g.font=(o.b?'700 ':'400 ')+s+'px '+F; g.fillStyle='#000'; g.textBaseline='top';
      if(o.k==='lr'){ if(!dry){g.textAlign='left';g.fillText(o.a,4,y);g.textAlign='right';g.fillText(o.r,W-4,y);g.textAlign='left';} y+=s*1.45; continue;}
      if(o.wrap){ let line=''; const words=('Segmenter' in Intl)?[...new Intl.Segmenter('th',{granularity:'word'}).segment(o.t)].map(x=>x.segment):o.t.split(/(\s+)/); for(const ch of words){ if(g.measureText(line+ch).width>W-8 && line){ if(!dry)g.fillText(line,4,y); y+=s*1.45; line=ch.trimStart();} else line+=ch;} if(line){if(!dry)g.fillText(line,4,y); y+=s*1.45;} continue;}
      if(!dry){ g.textAlign=o.c?'center':'left'; g.fillText(o.t,o.c?W/2:4,y); g.textAlign='left'; } y+=s*1.45;
    } return Math.ceil(y);
  };
  const h=render(true); c.height=h; c.style.height=h+'px';
  g.fillStyle='#fff'; g.fillRect(0,0,W,h); render(false); return c;
}
logo.onload=draw; draw();

function raster(c){
  const g=c.getContext('2d'), {width:w,height:h}=c, d=g.getImageData(0,0,w,h).data, bw=w/8;
  const out=[]; const CH=128;   // ส่งทีละ 128 แถว
  out.push(new Uint8Array([0x1B,0x40]));   // init
  for(let y0=0;y0<h;y0+=CH){ const rows=Math.min(CH,h-y0);
    const buf=new Uint8Array(8+bw*rows); buf.set([0x1D,0x76,0x30,0x00,bw&255,bw>>8,rows&255,rows>>8]);
    for(let y=0;y<rows;y++)for(let x=0;x<w;x++){const i=((y0+y)*w+x)*4; const lum=d[i]*.3+d[i+1]*.59+d[i+2]*.11; if(lum<150) buf[8+y*bw+(x>>3)]|=0x80>>(x&7);}
    out.push(buf);}
  out.push(new Uint8Array([0x1B,0x64,4]));  // feed 4 lines
  return out;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function send(parts){
  let n=0; for(const p of parts){ for(let i=0;i<p.length;i+=256){ await writer.write(p.slice(i,i+256)); n+=Math.min(256,p.length-i); await sleep(25);} }
  log('ส่งข้อมูลแล้ว '+n+' ไบต์');
}
document.getElementById('conn').onclick=async()=>{
  if(!('serial' in navigator)){ log('เบราว์เซอร์นี้ไม่รองรับ — ใช้ Google Chrome บน Mac'); return; }
  try{ port=await navigator.serial.requestPort(); await port.open({baudRate:9600}); writer=port.writable.getWriter();
    log('เชื่อมต่อแล้ว ✓'); document.getElementById('go').disabled=false; document.getElementById('txt').disabled=false;
  }catch(e){ log('เชื่อมต่อไม่ได้: '+e.message); }
};
document.getElementById('go').onclick=async()=>{ log('กำลังพิมพ์ใบรับซื้อ...'); try{ await send(raster(draw())); }catch(e){ log('ผิดพลาด: '+e.message);} };
document.getElementById('txt').onclick=async()=>{ const t=new TextEncoder().encode('\x1B@DD Gold - print test\nHello Y58!\n1234567890\n\n\n\n'); try{ await send([t]); }catch(e){ log('ผิดพลาด: '+e.message);} };
